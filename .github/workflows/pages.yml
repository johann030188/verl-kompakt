name: Verl aktualisieren und veröffentlichen
on:
  push:
    branches: [main]
  schedule:
    - cron: '20 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: verl-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Öffentliche Quellen prüfen
        run: node refresh-data.mjs
      - name: Bestätigte Daten speichern
        run: |
          git config user.name 'Verl kompakt'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add live.json
          if ! git diff --cached --quiet; then
            git commit -m 'Aktualisierte Verler Termine und Sportdaten'
            git pull --rebase origin main
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
