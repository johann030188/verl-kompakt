name: Verl aktualisieren und veröffentlichen
on:
  push:
    branches: [main]
  schedule:
    - cron: '20 * * * *'
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: verl-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bestätigte Busabfahrten prüfen
        run: node refresh-departures.mjs
      - name: Öffentliche Quellen prüfen
        if: github.event_name != 'schedule' || github.event.schedule == '20 * * * *'
        run: node refresh-data.mjs
      - name: Offizielle Öffnungszeiten prüfen
        if: github.event_name != 'schedule' || github.event.schedule == '20 * * * *'
        run: node refresh-opening-hours.mjs
      - name: Neue russische Übersetzungen erkennen
        id: russian
        run: python3 translate-russian.py --check
      - uses: actions/setup-python@v5
        if: steps.russian.outputs.needed == 'true'
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-translation.txt
      - uses: actions/cache@v4
        if: steps.russian.outputs.needed == 'true'
        with:
          path: ~/.cache/verl-translation-models
          key: verl-argos-de-en-ru-v1-becc2b-591d74
      - name: Lokale Übersetzung vorbereiten
        if: steps.russian.outputs.needed == 'true'
        run: python -m pip install -r requirements-translation.txt
      - name: Neue Inhalte auf Russisch übersetzen
        if: steps.russian.outputs.needed == 'true'
        run: python translate-russian.py
      - name: Bestätigte Daten speichern
        run: |
          git config user.name 'Verl kompakt'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add live.json departures.json russian.json opening-hours.json
          if ! git diff --cached --quiet; then
            git commit -m 'Aktualisierte Verler Quellen und Busabfahrten'
            git pull --rebase origin main
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4

